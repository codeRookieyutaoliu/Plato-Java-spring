name: Java CI/CD

on:
  push:
    branches: [ main, master, develop, release/* ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: 设置JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: 检查代码风格
      run: mvn checkstyle:check

    - name: 代码静态分析
      run: mvn spotbugs:check

    - name: 构建并测试
      run: mvn -B package

    - name: 代码覆盖率测试
      run: mvn jacoco:report
      
    - name: 构建Docker镜像
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')
      run: |
        docker build -t plato-app:${{ github.sha }} .
        docker tag plato-app:${{ github.sha }} plato-app:latest

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    steps:
    - name: 部署到开发环境
      run: echo "部署到开发环境" # 实际部署命令

  deploy-test:
    needs: build
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment: testing
    steps:
    - name: 部署到测试环境
      run: echo "部署到测试环境" # 实际部署命令

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: 部署到生产环境
      run: echo "部署到生产环境" # 实际部署命令 